# Mosquitto configuration for Lucia Pilot
# NFR-4 NOTE: Anonymous access is enabled for the demo pilot only.
# Phase 2 production must enable TLS + password_file authentication.

# -----------------------------------------------------------------------
# Listener: plain MQTT on port 1883
# -----------------------------------------------------------------------
listener 1883
allow_anonymous true

# -----------------------------------------------------------------------
# Listener: WebSocket on port 9001 (used by browser-based clients / demo UI)
# -----------------------------------------------------------------------
listener 9001
protocol websockets
allow_anonymous true

# -----------------------------------------------------------------------
# Persistence — retain messages across broker restarts
# -----------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# Retained messages: enabled so simulator state survives reconnects
retained_persistence true

# -----------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# -----------------------------------------------------------------------
# Connection limits (Phase 2: tune for 9,354-building scale)
# -----------------------------------------------------------------------
max_connections 1024
max_keepalive 60

# -----------------------------------------------------------------------
# Topic conventions (informational — no ACL enforced for demo pilot)
#
# NFR-4 requires HTTPS/TLS only at the engine boundary, not within the
# local Docker network. Anonymous access is therefore acceptable for the
# pilot. Phase 2 must add a password_file and/or TLS mutual auth.
#
# Ingestion path (ADR-0003):
#   site/+/generation        — simulator publishes one event/min per building
#                              (QoS 1); engine subscribes with wildcard.
#                              Payload schema: GenerationEvent from
#                              packages/contracts/src/generation.ts
#
# Admin / anomaly injection (FR-D-002):
#   site/+/anomaly/admin     — admin injects anomaly events via
#                              POST /api/admin/anomaly (engine re-publishes
#                              here so the simulator can react).
#
# Dead-letter (FR-D-003 backpressure):
#   lucia/dlq/+              — malformed or unprocessable events routed here
#                              by the engine for operator inspection.
# -----------------------------------------------------------------------
